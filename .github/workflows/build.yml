name: Build Portable Windows Exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build Portable Exe
        run: pnpm run dist -- --win portable

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deemix-Portable-Windows
          path: dist/*.exe
