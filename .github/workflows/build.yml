name: Build Portable Windows Exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Install Dependencies
        run: |
          pnpm install
          pnpm add -D -w @electron-forge/maker-squirrel @electron-forge/maker-zip

      - name: Build Project
        run: pnpm build

      - name: Package Application
        run: pnpm --filter deemix-gui package

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deemix-Portable-Windows
          path: packages/gui/out/
